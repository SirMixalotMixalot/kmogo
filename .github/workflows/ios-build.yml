name: Roam iOS Build

on:
  push:
    branches: [MP2-Roam, bk/login]
  pull_request:
    branches: [main, MP2-Roam]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Roam for iOS Simulator
    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Roam
        run: |
          xcodebuild -version
          xcodebuild build \
            -project Roam.xcodeproj \
            -scheme Roam \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests on a simulator
        if: github.event_name == 'workflow_dispatch'
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json
          import sys
          devices = json.load(sys.stdin)["devices"]
          iphones = [device for runtime in devices.values() for device in runtime
                     if device["name"].startswith("iPhone")]
          print(iphones[0]["udid"])
          ')
          xcodebuild test \
            -project Roam.xcodeproj \
            -scheme Roam \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
